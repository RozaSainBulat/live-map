s2:'<svg viewBox="0 0 120 90"><circle cx="60" cy="40" r="12" fill="#1e88e5" stroke="#fff" stroke-width="3"/><path d="M60 46 v30 q0 8 8 8 h10 q10 0 10 -10 v-22 q0 -6 -6 -6 q-6 0 -6 6 v-8 q0 -6 -6 -6 q-6 0 -6 6 v-6" fill="#ffe0b2" stroke="#5B2D90" stroke-width="3" transform="translate(-8,-12) scale(.9)"/></svg>',
s3:'<svg viewBox="0 0 120 90"><rect x="10" y="8" width="100" height="56" rx="12" fill="#25D366"/><path d="M30 64 l-8 18 l24 -14z" fill="#25D366"/><text x="60" y="44" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="26" fill="#fff">SCO</text></svg>'};
function stepsHtml(){const t=T[lang];return [1,2,3].map(i=>`<div class="step">${SVG["s"+i]}<b>${i}. ${t["s"+i]}</b><span>${t["s"+i+"d"]}</span></div>`).join("")}
function applyLang(){const t=T[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
document.querySelectorAll("[data-t]").forEach(e=>{const k=e.dataset.t;if(t[k]!==undefined)e.innerHTML=t[k]});
document.getElementById("steps").innerHTML=stepsHtml();document.getElementById("steps2").innerHTML=stepsHtml();
document.title=t.hero_title;document.querySelector("#grp").dataset.l=lang;if(window.renderGroups)window.renderGroups();if(window.renderLegend)window.renderLegend()}
const sel=document.getElementById("lang");Object.keys(LN).forEach(k=>sel.insertAdjacentHTML("beforeend",`<option value="${k}">${LN[k]}</option>`));sel.value=lang;
sel.onchange=()=>{lang=sel.value;try{localStorage.setItem("rtn1_lang",lang)}catch(e){};applyLang();if(window.refreshPopups)window.refreshPopups()};
const menu=document.getElementById("menu");document.getElementById("burger").onclick=()=>{menu.style.display=menu.style.display==="block"?"none":"block"};
document.getElementById("mhow").onclick=()=>{document.getElementById("howm").style.display="flex";menu.style.display="none"};
document.getElementById("msub").onclick=()=>{document.getElementById("subm").style.display="flex";menu.style.display="none"};
applyLang();
fetch("data.json?"+Date.now()).then(r=>r.json()).then(D=>{
const map=L.map("map",{worldCopyJump:true}).setView([20,20],2);L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"© OpenStreetMap"}).addTo(map);
const layers={},mk={},pts={};D.cats.forEach(c=>{layers[c.id]=L.layerGroup();if(!c.off)layers[c.id].addTo(map)});
const GROUPS=[["oil","g_oil",["OIL"]],["gold","g_gold",["GOLD"]],["fert","g_fert",["FERT"]],["other","g_other",null]];
const known=new Set(["OIL","GOLD","FERT"]);GROUPS[3][2]=D.cats.map(c=>c.id).filter(i=>!known.has(i));
const on={};GROUPS.forEach(g=>on[g[0]]=true);const tankOff=new Set(D.cats.filter(c=>c.off).map(c=>c.id));
function showCat(id,v){v?layers[id].addTo(map):map.removeLayer(layers[id])}
window.renderGroups=function(){const t=T[lang],el=document.getElementById("grp");el.innerHTML="";GROUPS.forEach(g=>{const l=document.createElement("label");l.innerHTML=`<input type="checkbox" ${on[g[0]]?"checked":""}> ${t[g[1]]}`;l.firstChild.onchange=e=>{on[g[0]]=e.target.checked;g[2].forEach(id=>showCat(id,e.target.checked&&!(tankOff.has(id)&&!window._tank)))};el.appendChild(l)});
if(D.cats.some(c=>c.off)){const l=document.createElement("label");l.innerHTML=`<input type="checkbox" ${window._tank?"checked":""}> 🛢 Tank storage`;l.firstChild.onchange=e=>{window._tank=e.target.checked;D.cats.filter(c=>c.off).forEach(c=>showCat(c.id,e.target.checked))};el.appendChild(l)}};
window.renderLegend=function(){const t=T[lang];document.getElementById("legend").innerHTML=`<b>${t.legend}</b>`+D.cats.map(c=>`<div><i style="background:${c.color}"></i>${c.icon} ${c.name}</div>`).join("")+`<div>${t.verified}</div>`};
function popup(p){const t=T[lang];return `<b>${p.product}${p.verified?" ✓":""}</b><br>${p.place}${p.exact?"":" "+t.region}<br>${p.storage?t.accepts+": ":t.terms+": "}${p.terms}<br>${p.price?t.price+": "+p.price+"<br>":""}${p.cond?t.cond+": "+p.cond+"<br>":""}${p.volume?t.volume+": "+p.volume+"<br>":""}<small>${p.code}</small><br><a class="btn" target="_blank" onclick="hit('req-${p.code}')" href="https://wa.me/${WA}?text=${encodeURIComponent(p.storage?("Need tank storage at "+p.place):("Interested in "+p.code))}">${p.storage?t.reqs:t.req}</a>`}
window.refreshPopups=function(){D.points.forEach(p=>{if(mk[p.code])mk[p.code].setPopupContent(popup(p))})};
D.points.forEach(p=>{const c=D.cats.find(x=>x.id===p.cat);const ic=L.divIcon({className:"",html:`<div class="dot" style="background:${c.color};color:${c.color}"><span style="color:#000">${c.icon}</span></div>`,iconSize:[24,24]});
const m=L.marker([p.lat,p.lon],{icon:ic}).addTo(layers[p.cat]);mk[p.code]=m;pts[p.code]=p;
m.bindPopup(popup(p));m.on("popupopen",()=>{hit("open-"+p.code);history.replaceState(null,"","#"+p.code);killHint()})});
renderGroups();renderLegend();
let hinted=null;function killHint(){if(hinted){hinted.closeTooltip();hinted.unbindTooltip();hinted=null}try{localStorage.setItem("rtn1_seen","1")}catch(e){}}
let seen=false;try{seen=localStorage.getItem("rtn1_seen")==="1"}catch(e){}
if(!seen){const cands=D.points.filter(p=>!p.storage&&p.exact);const ctr=map.getCenter();let best=null,bd=1e18;cands.forEach(p=>{const d=Math.pow(p.lat-ctr.lat,2)+Math.pow(p.lon-ctr.lng,2);if(d<bd){bd=d;best=p}});
if(best){hinted=mk[best.code];hinted.bindTooltip(T[lang].hint,{permanent:true,direction:"top",className:"hint",offset:[0,-10]}).openTooltip()}}
function go(){const c=location.hash.slice(1);if(mk[c]){document.getElementById("mapwrap").scrollIntoView();map.setView(mk[c].getLatLng(),6);mk[c].openPopup()}}go();addEventListener("hashchange",go)});
function upd(){const v=id=>document.getElementById(id).value.trim();const c=v("c"),em=c.includes("@");document.getElementById("subgo").href="https://wa.me/"+WA+"?text="+encodeURIComponent("WEEKLY "+(em?"2":"1")+", "+(em?c+", ":"")+v("p")+", "+v("pr")+", "+v("pc")+", "+v("d")+(v("n")?" ("+v("n")+")":""))}
document.querySelectorAll("#sub input,#sub select").forEach(i=>i.oninput=upd);upd();
</script></body></html>
